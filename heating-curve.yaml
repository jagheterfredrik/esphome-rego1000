# Heating curve: read and adjust the heat pump's own heating circuit from Home Assistant.
#
# Include from your device config, e.g.:
#   packages:
#     heating_curve: !include heating-curve.yaml
#
# Uses the substitutions from rego1000-v3.6.0.yaml (verified on Rego 1000 v3.6).
#
# Model (verified against the display and HEATING_CURVE_VALUE):
#   * 11 points, every 5 °C from the dimensioning outdoor temperature (DUT,
#     HEATING_CURVE_RIGHT_X_LOCAL, e.g. -30 °C) up to +20 °C.
#   * Base line: straight line from (+20 °C, HEATING_CURVE_LEFT_Y_LOCAL) to
#     (DUT, HEATING_CURVE_RIGHT_Y_LOCAL).
#   * Each point = base line + offset HEATING_CURVE_Yn_LOCAL, where Y1 = DUT ... Y11 = +20 °C.
#   * The pump interpolates linearly between points using the attenuated outdoor
#     temperature (GT2_ATTENUATED_TEMP). HEATING_SETPOINT = curve value + room sensor influence.
#   * Use the *_LOCAL variables. The *_GLOBAL variants belong to extra mixing circuits
#     and writing them does not change the pump's own curve.

sensor:
  - platform: rego1000
    name: "Curve value (calculated)"
    id: curve_value
    rego_variable: $HEATING_CURVE_VALUE
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    poll_interval: 60s
  - platform: rego1000
    name: "Outdoor attenuated (GT2)"
    rego_variable: $GT2_ATTENUATED_TEMP
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    poll_interval: 60s
  - platform: rego1000
    name: "Curve right X (DUT)"
    id: curve_dut
    rego_variable: $HEATING_CURVE_RIGHT_X_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y1 local"
    rego_variable: $HEATING_CURVE_Y1_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y2 local"
    rego_variable: $HEATING_CURVE_Y2_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y3 local"
    rego_variable: $HEATING_CURVE_Y3_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y4 local"
    rego_variable: $HEATING_CURVE_Y4_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y5 local"
    rego_variable: $HEATING_CURVE_Y5_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y6 local"
    rego_variable: $HEATING_CURVE_Y6_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y7 local"
    rego_variable: $HEATING_CURVE_Y7_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y8 local"
    rego_variable: $HEATING_CURVE_Y8_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y9 local"
    rego_variable: $HEATING_CURVE_Y9_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y10 local"
    rego_variable: $HEATING_CURVE_Y10_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min
  - platform: rego1000
    name: "Curve point Y11 local"
    rego_variable: $HEATING_CURVE_Y11_LOCAL
    value_factor: .1
    unit_of_measurement: °C
    accuracy_decimals: 1
    entity_category: diagnostic
    poll_interval: 5min

  # Tracking: how much the room sensor adds on top of the curve.
  # Consistently positive at a given outdoor temperature = curve too low there,
  # consistently negative = curve too high (ignore periods with stove/sun heat).
  - platform: rego1000
    id: curve_setpoint
    internal: true
    rego_variable: $HEATING_SETPOINT
    value_factor: .1
    poll_interval: 60s
  - platform: template
    name: "Room sensor contribution"
    icon: mdi:thermometer-plus
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      const float sp = id(curve_setpoint).state, cv = id(curve_value).state;
      if (std::isnan(sp) || std::isnan(cv)) return {};
      return sp - cv;
number:
  - platform: rego1000
    name: "Curve left (+20 °C)"
    id: curve_left
    rego_variable: $HEATING_CURVE_LEFT_Y_LOCAL
    unit_of_measurement: °C
    min_value: 10
    max_value: 50
    step: .5
    value_factor: .1
    poll_interval: 5min
  - platform: rego1000
    name: "Curve right (DUT)"
    id: curve_right
    rego_variable: $HEATING_CURVE_RIGHT_Y_LOCAL
    unit_of_measurement: °C
    min_value: 20
    max_value: 80
    step: .5
    value_factor: .1
    poll_interval: 5min
  - platform: rego1000
    name: "Curve parallel offset"
    rego_variable: $HEATING_CURVE_PARALLEL_OFFSET
    unit_of_measurement: °C
    min_value: -10
    max_value: 10
    step: .5
    value_factor: .1
    poll_interval: 5min
  # Raw offsets on top of the base line (internal; set through the template numbers below)
