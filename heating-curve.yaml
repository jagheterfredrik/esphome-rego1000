    internal: true
    min_value: -20
    max_value: 40
    step: .1
    value_factor: .1
    poll_interval: 5min
  - platform: rego1000
    name: "Curve offset Y11"
    id: curve_off_11
    rego_variable: $HEATING_CURVE_Y11_LOCAL
    internal: true
    min_value: -20
    max_value: 40
    step: .1
    value_factor: .1
    poll_interval: 5min
  # Supply temperature per outdoor temperature. Numbered so they sort +20 ... -30.
  - platform: template
    name: "Heating curve 01: +20 °C outdoor"
    icon: mdi:chart-bell-curve-cumulative
    unit_of_measurement: °C
    min_value: 10
    max_value: 70
    step: .5
    mode: box
    update_interval: 30s
    lambda: |-
      const float D = id(curve_dut).state, L = id(curve_left).state, R = id(curve_right).state;
      const float o = id(curve_off_11).state;
      if (std::isnan(D) || std::isnan(L) || std::isnan(R) || std::isnan(o) || D >= 20.0f) return {};
      const float t = D + 10.0f * (20.0f - D) / 10.0f;
      return roundf((L + (20.0f - t) * (R - L) / (20.0f - D) + o) * 10.0f) / 10.0f;
    set_action:
      - number.set:
          id: curve_off_11
          value: !lambda |-
            const float D = id(curve_dut).state, L = id(curve_left).state, R = id(curve_right).state;
            const float t = D + 10.0f * (20.0f - D) / 10.0f;
            return roundf((x - (L + (20.0f - t) * (R - L) / (20.0f - D))) * 10.0f) / 10.0f;
