esphome:
  name: heatpump-logger

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "esp-rego1000"
    password: !secret fallback_password

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

# The OTA configuration was changed in esphome 2024.06.
# For earlier releases the '- platform: esphome' should not be included
ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source: components

web_server:

canbus:
  - platform: esp32_can
    id: can0
    can_id: 0
    tx_pin: GPIO23
    rx_pin: GPIO22
    bit_rate: 125kbps

climate:
  - platform: rego1000
    name: House
    rego_setpoint_variable: $ROOM_SETPOINT_BASE_TEMP
    sensor_id: indoor_temp

sensor:
  - platform: homeassistant
    entity_id: sensor.indoor_temperature
    id: indoor_temp
    accuracy_decimals: 1
  - platform: rego1000
    name: Heat Carrier 1
    rego_variable: $GT1_TEMP
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Outdoor
    rego_variable: $GT2_TEMP
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Warm water
    rego_variable: $GT3_TEMP
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Hot gas
    rego_variable: $GT6_TEMP
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Heat fluid out
    rego_variable: $GT8_TEMP
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Heat fluid in
    rego_variable: $GT9_TEMP
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Cold fluid in
    rego_variable: $GT10_TEMP
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Cold fluid out
    rego_variable: $GT11_TEMP
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Heating start
    rego_variable: $HEATING_START
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Heating stop
    rego_variable: $HEATING_STOP
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  - platform: rego1000
    name: Heating setpoint
    rego_variable: $HEATING_SETPOINT
    value_factor: .1
    unit_of_measurement: °C
    state_class: measurement
    accuracy_decimals: 1
  # - platform: rego1000
  #   name: Energy output
  #   rego_variable: $STATS_ENERGY_OUTPUT
  #   value_factor: .01
  #   unit_of_measurement: kWh
  #   state_class: "total_increasing"
  #   device_class: "energy"
  #   accuracy_decimals: 2

binary_sensor:
- platform: rego1000
  name: "Heat carrier pump"
  rego_listen_can_id: 0x00028${REGO_CAN_SUFFIX}
- platform: rego1000
  name: "Heat fluid pump"
  rego_listen_can_id: 0x0002c${REGO_CAN_SUFFIX}
- platform: rego1000
  name: "Three-way valve"
  rego_listen_can_id: 0x00038${REGO_CAN_SUFFIX}
- platform: rego1000
  name: "Additional heat"
  rego_listen_can_id: 0x0003c${REGO_CAN_SUFFIX}
- platform: rego1000
  name: "Compressor"
  rego_listen_can_id: 0x00048${REGO_CAN_SUFFIX}
- platform: rego1000
  name: "Cold fluid pump"
  rego_listen_can_id: 0x00054${REGO_CAN_SUFFIX}
# DHW circulation pump output. Verified on a Greenline HE (program generation 3, version 10):
# broadcast 0x00044 switches on exactly when the circulation pump runs.
- platform: rego1000
  name: "DHW circulation pump"
  rego_listen_can_id: 0x00044${REGO_CAN_SUFFIX}

number:
- platform: rego1000
  name: Hysterisis min
  rego_variable: $HEATING_1A_DIFF_MIN
  unit_of_measurement: °C
  min_value: 2
  max_value: 30
  step: .1
  value_factor: .1
- platform: rego1000
  name: Hysterisis max
  rego_variable: $HEATING_1A_DIFF_MAX
  unit_of_measurement: °C
  min_value: 2
  max_value: 30
  step: .1
  value_factor: .1
- platform: rego1000
  name: Hysterisis time factor
  rego_variable: $HEATING_1A_DIFF_CONST
  min_value: 10
  max_value: 30
  step: 1
  value_factor: .1
# DHW circulation programs. The controller stores times in 15 minute slots,
# so value_factor .25 shows hours (13.25 = 13:15). 0xD0 means "program off"
# and reads back as -12 h (signed byte); write 52 to switch a program off.
- platform: rego1000
  name: Circulation program 1 start
  rego_variable: $PUMP_DHW_PROGRAM1_START_TIME
  value_factor: .25
  unit_of_measurement: h
  min_value: 0
  max_value: 52
  step: .25
  poll_interval: 5min
- platform: rego1000
  name: Circulation program 1 stop
  rego_variable: $PUMP_DHW_PROGRAM1_STOP_TIME
  value_factor: .25
  unit_of_measurement: h
  min_value: 0
  max_value: 52
  step: .25
  poll_interval: 5min
# Extra hot water (XDHW). XDHW_TIME starts extra hot water for N hours,
# the weekly program (thermal disinfection) runs on XDHW_WEEKPROGRAM_DAY
# (1 = Monday ... 7 = Sunday, 0 = off) at XDHW_WEEKPROGRAM_HOUR (controller clock).
- platform: rego1000
  name: Extra hot water time
  rego_variable: $XDHW_TIME
  unit_of_measurement: h
  min_value: 0
  max_value: 48
  step: 1
  poll_interval: 60s
- platform: rego1000
  name: Extra hot water weekly day
  rego_variable: $XDHW_WEEKPROGRAM_DAY
  min_value: 0
  max_value: 7
  step: 1
  poll_interval: 5min
- platform: rego1000
  name: Extra hot water weekly hour
  rego_variable: $XDHW_WEEKPROGRAM_HOUR
  min_value: 0
  max_value: 23
  step: 1
  poll_interval: 5min
# Controller clock. Ours had drifted 9.5 h, which shifts every timed program;
# writing these numbers (e.g. from a daily Home Assistant automation) sets it.
- platform: rego1000
  name: Clock hour
  rego_variable: $DATE_HOUR
  min_value: 0
  max_value: 23
  step: 1
  poll_interval: 60s
  entity_category: config
- platform: rego1000
  name: Clock minute
  rego_variable: $DATE_MIN
  min_value: 0
  max_value: 59
  step: 1
  poll_interval: 60s
  entity_category: config
- platform: rego1000
  name: Clock day
  rego_variable: $DATE_DAY
  min_value: 1
  max_value: 31
  step: 1
  poll_interval: 10min
  entity_category: config
- platform: rego1000
  name: Clock day of week
  rego_variable: $DATE_DAY_OF_WEEK
  min_value: 1
  max_value: 7
  step: 1
  poll_interval: 10min
  entity_category: config
- platform: rego1000
  name: Room dial range
  rego_variable: $ROOM_DIAL_RANGE
  min_value: 0
  max_value: 6
  step: 1

switch:
- platform: rego1000
  name: "DHW Economy"
  rego_variable: $DHW_STATE_ECONOMY
- platform: rego1000
  name: "Admin access"
  rego_variable: $ACCESS_LEVEL
- platform: rego1000
  name: "DHW circulation enabled"
  rego_variable: $PUMP_DHW_ACTIVE
- platform: rego1000
  name: "Additional heat for extra hot water"
  rego_variable: $ADDITIONAL_ALLOW_XDHW
